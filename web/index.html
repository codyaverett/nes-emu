<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nes-emu</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; background: #111; color: #ddd;
    font: 14px/1.4 system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    padding: 16px; min-height: 100vh; box-sizing: border-box;
  }
  h1 { font-size: 18px; margin: 0; }
  #screen-wrap {
    position: relative; background: #000;
    width: min(96vw, calc((100vh - 220px) * 240 / 224));
    aspect-ratio: 240 / 224;
    outline: 1px solid #333;
  }
  #screen-wrap.full-frame { aspect-ratio: 256 / 240; }
  canvas {
    width: 100%; height: 100%; display: block;
    image-rendering: pixelated; image-rendering: crisp-edges;
  }
  #gate {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 8px;
    background: rgba(0,0,0,.85); cursor: pointer; text-align: center;
  }
  #gate.drag { outline: 3px dashed #6cf; }
  #gate[hidden] { display: none; }
  #toast {
    position: absolute; left: 8px; bottom: 8px; padding: 4px 8px;
    background: rgba(0,0,0,.7); color: #fff; font-family: monospace;
    pointer-events: none; transition: opacity .3s;
  }
  #toast[hidden] { display: none; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; }
  button, label.btn {
    background: #222; color: #ddd; border: 1px solid #555; padding: 6px 12px;
    border-radius: 4px; cursor: pointer; font: inherit;
  }
  button:hover, label.btn:hover { background: #333; }
  input[type=file] { display: none; }
  #stats { font-family: monospace; font-size: 12px; color: #999; }
  #keys { font-size: 12px; color: #999; max-width: 720px; text-align: center; }
  kbd { background: #222; border: 1px solid #555; border-radius: 3px; padding: 0 4px; }
</style>
</head>
<body>
<h1>nes-emu</h1>
<div id="screen-wrap">
  <canvas id="screen" width="240" height="224"></canvas>
  <div id="gate">
    <strong>Drop a .nes file here or click to choose one</strong>
    <span>Nothing is uploaded; the ROM stays in this tab.</span>
  </div>
  <div id="toast" hidden></div>
</div>
<div class="row">
  <label class="btn">Open ROM<input id="rom-input" type="file" accept=".nes,application/octet-stream"></label>
  <button id="btn-reset" title="R">Reset</button>
  <button id="btn-pause" title="P">Pause</button>
  <button id="btn-mute" title="M">Mute</button>
  <button id="btn-crop" title="Toggle the 8 pixel overscan crop">Full frame</button>
  <button id="btn-full" title="F">Fullscreen</button>
</div>
<div id="stats">no ROM loaded</div>
<div id="keys">
  Player 1: <kbd>Z</kbd> A, <kbd>X</kbd> B, <kbd>Right Shift</kbd> Select, <kbd>Enter</kbd> Start, arrows.
  Player 2: <kbd>'</kbd> A, <kbd>;</kbd> B, <kbd>,</kbd> Select, <kbd>.</kbd> Start, <kbd>I</kbd><kbd>J</kbd><kbd>K</kbd><kbd>L</kbd>.
  <kbd>R</kbd> reset, <kbd>P</kbd> pause, <kbd>M</kbd> mute, <kbd>F</kbd> fullscreen.
</div>
<script type="module" src="app.js"></script>
</body>
</html>
